[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resuapp"
version = "1.0.0"
description = "Generador de las plantillas Excel del reporte RESU (UAFE - SISLAFT) para cargarlas en el UAFI oficial"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "openpyxl>=3.1",
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
resuapp-cli = "resuapp.__main__:main"

[project.gui-scripts]
resuapp = "resuapp.__main__:main"

[tool.setuptools.package-data]
resuapp = ["datos/plantillas/*.xlsx"]

[tool.setuptools.packages.find]
include = ["resuapp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
